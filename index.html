<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Backrooms Survival</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #b8a352;
    font-family: 'Courier New', monospace; color: #ffef9a;
    user-select: none; -webkit-user-select: none;
  }
  canvas { display: block; position: fixed; inset: 0; }
  canvas.in-game { cursor: crosshair; }
  #hud {
    position: fixed; top: 0; left: 0; padding: 14px 18px;
    pointer-events: none; text-shadow: 0 0 6px #000;
    font-size: 14px; line-height: 1.6; z-index: 5; color: #ffef9a;
    display: none;
  }
  #hud.on { display: block; }
  #hpbar {
    width: 200px; height: 10px; border: 1px solid #ffef9a;
    margin: 4px 0 10px; background: rgba(0,0,0,.4); overflow: hidden;
  }
  #hpfill { height: 100%; width: 100%; background: #d8e04a; transition: width .15s, background .2s; }
  #topbar {
    position: fixed; top: 0; left: 50%; transform: translateX(-50%);
    padding: 14px 24px; z-index: 5; pointer-events: none;
    text-align: center; text-shadow: 0 0 8px #000, 0 0 3px #000;
  }
  #timer { font-size: 34px; font-weight: bold; letter-spacing: 2px; color: #fff8c8; }
  #levelLabel { font-size: 12px; opacity: 0.75; letter-spacing: 3px; margin-top: -2px; }
  #timer.warning { color: #ff9a55; }
  #timer.critical { color: #ff5050; animation: pulse 0.6s infinite; }
  @keyframes pulse { 50% { opacity: 0.5; } }
  #crosshair {
    position: fixed; left: 50%; top: 50%; width: 22px; height: 22px;
    margin: -11px 0 0 -11px; pointer-events: none; opacity: .95; z-index: 4;
    display: none;
  }
  #crosshair.on { display: block; }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: #fff8c8; box-shadow: 0 0 3px #000;
  }
  #crosshair::before { left: 10px; top: 0; width: 2px; height: 22px; }
  #crosshair::after  { top: 10px; left: 0; height: 2px; width: 22px; }
  #hitmark {
    position: fixed; left: 50%; top: 50%; margin: -14px 0 0 -14px;
    color: #ff5050; font-size: 24px; font-weight: bold; opacity: 0;
    pointer-events: none; transition: opacity .1s; z-index: 4;
  }
  #damage {
    position: fixed; inset: 0; pointer-events: none; z-index: 3;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(255,0,0,.55) 100%);
    opacity: 0; transition: opacity .3s;
  }
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(60,40,0,.55) 100%);
  }
  #menu {
    position: fixed; inset: 0; z-index: 20;
    background: radial-gradient(ellipse at center, #2b230f 0%, #0a0805 100%);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; padding: 24px; overflow-y: auto;
  }
  #menu::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,240,150,0.03) 0px, rgba(255,240,150,0.03) 1px, transparent 1px, transparent 3px);
  }
  #menu h1 {
    font-size: 46px; letter-spacing: 8px; margin: 0 0 6px;
    color: #ffe98a; text-shadow: 0 0 20px rgba(255,220,100,0.6), 0 0 40px rgba(255,200,50,0.3);
    font-weight: normal;
  }
  #menu .subtitle {
    font-size: 13px; letter-spacing: 3px; opacity: 0.6; margin-bottom: 40px;
    text-transform: uppercase;
  }
  #levelGrid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px;
    max-width: 720px; width: 100%; position: relative;
  }
  .levelCard {
    padding: 16px 10px; border-radius: 8px;
    background: rgba(0,0,0,0.55);
    border: 2px solid #6b5c2a;
    cursor: pointer; transition: all 0.15s ease;
    text-align: center; position: relative;
  }
  .levelCard:hover:not(.locked) {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(255,220,100,0.15);
  }
  .levelCard .num {
    font-size: 30px; font-weight: bold; line-height: 1;
    text-shadow: 0 0 12px currentColor;
  }
  .levelCard .meta {
    font-size: 10px; opacity: 0.75; margin-top: 8px;
    letter-spacing: 1px; line-height: 1.5;
  }
  .levelCard .diff {
    font-size: 9px; letter-spacing: 2px; margin-top: 6px;
    opacity: 0.9; text-transform: uppercase;
  }
  .levelCard.locked { opacity: 0.28; cursor: not-allowed; filter: grayscale(1); }
  .levelCard.locked::after { content: '🔒'; position: absolute; top: 6px; right: 8px; font-size: 13px; }
  .levelCard.tier-1 { border-color: #4a8b3d; color: #8fdf78; }
  .levelCard.tier-2 { border-color: #a3a13a; color: #e8e05a; }
  .levelCard.tier-3 { border-color: #b87a2a; color: #ffb85c; }
  .levelCard.tier-4 { border-color: #a33a2a; color: #ff7a5c; }
  .levelCard.tier-5 { border-color: #7a2a8b; color: #d878ff; }
  #menu .foot {
    margin-top: 36px; font-size: 11px; opacity: 0.5; letter-spacing: 2px;
    text-align: center;
  }
  #menu .foot button {
    background: transparent; border: 1px solid rgba(255,230,150,0.3);
    color: #ffef9a; padding: 6px 14px; font-family: inherit; font-size: 11px;
    letter-spacing: 2px; cursor: pointer; border-radius: 4px;
    margin-top: 14px; text-transform: uppercase;
    transition: all 0.15s;
  }
  #menu .foot button:hover { background: rgba(255,230,150,0.1); border-color: rgba(255,230,150,0.6); }
  #endScreen {
    position: fixed; inset: 0; z-index: 15;
    background: rgba(0,0,0,0.75);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; color: #fff; text-align: center;
    backdrop-filter: blur(3px);
  }
  #endScreen.on { display: flex; }
  #endTitle {
    font-size: 54px; letter-spacing: 6px; margin: 0;
    text-shadow: 0 0 24px currentColor;
    font-weight: normal;
  }
  #endTitle.win  { color: #a8e07a; }
  #endTitle.lose { color: #ff6a5c; }
  #endSub { font-size: 14px; opacity: 0.85; letter-spacing: 2px; margin: 12px 0 30px; }
  #endScreen .btnRow { display: flex; gap: 12px; }
  .btn {
    background: rgba(0,0,0,0.6); border: 2px solid #ffef9a;
    color: #ffef9a; padding: 12px 26px; font-family: inherit;
    font-size: 13px; letter-spacing: 3px; cursor: pointer;
    border-radius: 6px; text-transform: uppercase;
    transition: all 0.15s;
  }
  .btn:hover { background: rgba(255,230,150,0.15); transform: translateY(-2px); }
  .btn.primary { background: rgba(255,230,150,0.15); }
  #readyOverlay {
    position: fixed; inset: 0; z-index: 10;
    display: none; align-items: center; justify-content: center;
    flex-direction: column; color: #fff; text-align: center;
    text-shadow: 0 0 12px #000, 0 0 24px #000;
    background: rgba(30,25,10,0.35);
    pointer-events: none;
  }
  #readyOverlay.on { display: flex; }
  #readyMsg { font-size: 28px; letter-spacing: 3px; }
  #readySub { font-size: 12px; opacity: 0.8; letter-spacing: 2px; margin-top: 14px; line-height: 2; }
  #readySub kbd {
    background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.35);
    padding: 1px 6px; border-radius: 4px; font-family: inherit;
  }
</style>
</head>
<body>

<div id="vignette"></div>
<div id="damage"></div>
<div id="crosshair"></div>
<div id="hitmark">✕</div>

<div id="hud">
  <div>HP <span id="hp">100</span></div>
  <div id="hpbar"><div id="hpfill"></div></div>
  <div>KILLS <span id="kills">0</span></div>
</div>

<div id="topbar">
  <div id="timer">00:00</div>
  <div id="levelLabel">LEVEL 1</div>
</div>

<div id="readyOverlay">
  <div id="readyMsg">Level 1</div>
  <div id="readySub">Click to begin &nbsp;·&nbsp; <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &nbsp;·&nbsp; mouse look &nbsp;·&nbsp; click shoot</div>
</div>

<div id="menu">
  <h1>THE BACKROOMS</h1>
  <div class="subtitle">They always find you.</div>
  <div id="levelGrid"></div>
  <div class="foot">
    <div id="progressText">Progress: 1 / 10</div>
    <button id="resetBtn">Reset Progress</button>
  </div>
</div>

<div id="endScreen">
  <h1 id="endTitle">LEVEL CLEAR</h1>
  <div id="endSub"></div>
  <div class="btnRow" id="endBtns"></div>
</div>

<canvas id="c"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function () {
  'use strict';

  if (typeof THREE === 'undefined') {
    document.body.innerHTML =
      '<div style="padding:40px;color:#fff;font-family:monospace">Failed to load Three.js. Check your internet connection and reload.</div>';
    return;
  }

  /* =====================================================
     LEVELS  (steeper curve, level 1 kept gentle)
     ===================================================== */
  const LEVELS = [
    { time: 25, enemies: 2,  tier: 1, name: 'THE HUM' },
    { time: 30, enemies: 4,  tier: 1, name: 'DAMP CARPET' },
    { time: 35, enemies: 6,  tier: 2, name: 'WRONG TURN' },
    { time: 40, enemies: 8,  tier: 2, name: 'ENDLESS HALL' },
    { time: 45, enemies: 11, tier: 3, name: 'THE BUZZ' },
    { time: 50, enemies: 14, tier: 3, name: 'LOST SOULS' },
    { time: 55, enemies: 17, tier: 4, name: 'THEY KNOW' },
    { time: 60, enemies: 20, tier: 4, name: 'NO EXIT' },
    { time: 65, enemies: 24, tier: 5, name: 'TERMINAL' },
    { time: 75, enemies: 28, tier: 5, name: 'LEVEL 0' }
  ];

  /* =====================================================
     DIFFICULTY TUNING
     Enemy speed NEVER exceeds the player (6.2).
     ===================================================== */
  const PLAYER_SPEED = 6.2;
  const ENEMY_SPEED_CAP = 5.0;

  function enemyCfg(level) {
    return {
      speed:        Math.min(ENEMY_SPEED_CAP, 2.6 + level * 0.22),   // L1:2.8 → L10:4.8
      fireCooldown: Math.max(0.75, 2.2 - level * 0.15),              // L1:2.05 → L10:0.75
      hitChance:    Math.min(0.55, 0.15 + level * 0.040),            // L1:0.19 → L10:0.55
      range:        Math.min(48, 24 + level * 2.4),                  // L1:26.4 → L10:48
      noiseAmount:  Math.max(2.0, 8 - level * 0.55)                  // L1:7.45 → L10:2.5
    };
  }

  /* =====================================================
     STATE
     ===================================================== */
  function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  let progress = parseInt(lsGet('br_progress') || '1', 10);
  if (!(progress >= 1 && progress <= 10)) progress = 1;

  const canvas   = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

  const camera = new THREE.PerspectiveCamera(78, innerWidth / innerHeight, 0.05, 400);
  camera.rotation.order = 'YXZ';

  let scene = null;
  let gunGroup = null;

  let colliders = [];
  let enemies = [];
  let tracers = [];
  let cfg = enemyCfg(1);

  let gameState = 'menu';
  let currentLevel = 1;
  let hp = 100;
  let timeLeft = 0;
  let kills = 0;
  let lastDamage = -10;
  let regenAcc = 0;

  let yaw = 0, pitch = 0;
  let vy = 0, onGround = true;
  let isLocked = false;
  const keys = {};

  /* =====================================================
     RNG
     ===================================================== */
  function makeRNG(seed) {
    let s = (seed * 2654435761) >>> 0;
    return function () {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  /* =====================================================
     SCENE CONSTANTS — SMALLER ARENA (was GRID 18)
     ===================================================== */
  const YELLOW = 0xdcc868;
  const WALL_H = 3.2;
  const GRID   = 13;                 // 13x13 = 65x65 world
  const CELL   = 5;
  const HALF   = GRID * CELL / 2;

  const floorTex = (function () {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    const g = c.getContext('2d');
    g.fillStyle = '#b8a352'; g.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 6000; i++) {
      const x = Math.random() * 256, y = Math.random() * 256;
      const v = 90 + Math.random() * 80;
      g.fillStyle = 'rgba(' + v + ',' + (v - 20) + ',' + (v - 90) + ',' + (0.08 + Math.random() * 0.15) + ')';
      g.fillRect(x, y, 1.4, 1.4);
    }
    for (let i = 0; i < 8; i++) {
      const x = Math.random() * 256, y = Math.random() * 256, r = 8 + Math.random() * 30;
      const grd = g.createRadialGradient(x, y, 0, x, y, r);
      grd.addColorStop(0, 'rgba(70,55,20,0.18)');
      grd.addColorStop(1, 'rgba(70,55,20,0)');
      g.fillStyle = grd;
      g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(GRID * 2, GRID * 2);
    t.anisotropy = 4;
    return t;
  })();

  const wallTex = (function () {
    const c = document.createElement('canvas');
    c.width = 128; c.height = 128;
    const g = c.getContext('2d');
    g.fillStyle = '#e8dc88'; g.fillRect(0, 0, 128, 128);
    g.fillStyle = 'rgba(200,180,90,0.35)';
    for (let x = 0; x < 128; x += 6) g.fillRect(x, 0, 1, 128);
    g.fillStyle = 'rgba(120,100,40,0.15)';
    g.fillRect(0, 118, 128, 10);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(3, 2);
    return t;
  })();

  const wallMat  = new THREE.MeshLambertMaterial({ map: wallTex });
  const ceilMat  = new THREE.MeshLambertMaterial({ color: 0xdccc80 });

  const faceTex = (function () {
    const c = document.createElement('canvas');
    c.width = 128; c.height = 128;
    const g = c.getContext('2d');
    g.fillStyle = '#f4d13d'; g.fillRect(0, 0, 128, 128);
    g.fillStyle = '#111';
    g.beginPath(); g.arc(45, 50, 7, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(83, 50, 7, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#111'; g.lineWidth = 5; g.lineCap = 'round';
    g.beginPath(); g.arc(64, 72, 22, 0.12 * Math.PI, 0.88 * Math.PI); g.stroke();
    return new THREE.CanvasTexture(c);
  })();

  const LEGO_YELLOW = 0xf4d13d;
  const yellowMat = new THREE.MeshLambertMaterial({ color: LEGO_YELLOW });

  const legGeo   = new THREE.BoxGeometry(0.19, 0.62, 0.26);
  const torsoGeo = new THREE.BoxGeometry(0.52, 0.72, 0.30);
  const armGeo   = new THREE.BoxGeometry(0.15, 0.55, 0.15);
  const handGeo  = new THREE.CylinderGeometry(0.075, 0.075, 0.10, 8);
  const headGeo  = new THREE.CylinderGeometry(0.22, 0.22, 0.34, 16);
  const studGeo  = new THREE.CylinderGeometry(0.09, 0.09, 0.06, 12);
  const faceGeo  = new THREE.PlaneGeometry(0.34, 0.26);

  const torsoColors = [0x2255aa, 0xcc2222, 0x227733, 0xaa6600, 0x884488];

  function addWallSegment(x1, z1, x2, z2) {
    const dx = x2 - x1, dz = z2 - z1;
    const len = Math.hypot(dx, dz);
    if (len < 0.01) return;
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.28, WALL_H, len), wallMat);
    mesh.position.set((x1 + x2) / 2, WALL_H / 2, (z1 + z2) / 2);
    mesh.rotation.y = Math.atan2(dx, dz);
    scene.add(mesh);
    colliders.push(new THREE.Box3().setFromObject(mesh));
  }

  function buildLayout(level) {
    const rng = makeRNG(level * 1337 + 7);

    function nearSpawn(x, z, r) { return Math.hypot(x, z) < (r || 7); }

    for (let gx = 0; gx < GRID; gx++) {
      for (let gz = 0; gz < GRID; gz++) {
        const x = -HALF + gx * CELL;
        const z = -HALF + gz * CELL;

        if (rng() < 0.38 && !(nearSpawn(x, z) && nearSpawn(x + CELL, z))) {
          if (rng() < 0.30) {
            const gs = x + CELL * (0.25 + rng() * 0.3);
            addWallSegment(x, z, gs, z);
            addWallSegment(gs + 1.4, z, x + CELL, z);
          } else {
            addWallSegment(x, z, x + CELL, z);
          }
        }
        if (rng() < 0.38 && !(nearSpawn(x, z) && nearSpawn(x, z + CELL))) {
          if (rng() < 0.30) {
            const gs = z + CELL * (0.25 + rng() * 0.3);
            addWallSegment(x, z, x, gs);
            addWallSegment(x, gs + 1.4, x, z + CELL);
          } else {
            addWallSegment(x, z, x, z + CELL);
          }
        }
      }
    }
    addWallSegment(-HALF, -HALF, HALF, -HALF);
    addWallSegment(HALF, -HALF, HALF, HALF);
    addWallSegment(HALF, HALF, -HALF, HALF);
    addWallSegment(-HALF, HALF, -HALF, -HALF);

    const panelGeo = new THREE.BoxGeometry(2.4, 0.06, 1.0);
    const panelMat = new THREE.MeshBasicMaterial({ color: 0xfff8cc });
    const frameGeo = new THREE.BoxGeometry(2.55, 0.09, 1.15);
    const frameMat = new THREE.MeshLambertMaterial({ color: 0xbbaa66 });

    for (let gx = 0; gx < GRID; gx += 2) {
      for (let gz = 0; gz < GRID; gz += 2) {
        const x = -HALF + gx * CELL + CELL / 2;
        const z = -HALF + gz * CELL + CELL / 2;
        const frame = new THREE.Mesh(frameGeo, frameMat);
        frame.position.set(x, WALL_H - 0.02, z);
        scene.add(frame);
        const panel = new THREE.Mesh(panelGeo, panelMat);
        panel.position.set(x, WALL_H - 0.06, z);
        scene.add(panel);
      }
    }
  }

  /* =====================================================
     LEGO MINIFIG
     ===================================================== */
  function makeLegoFigure(torsoColor) {
    const g = new THREE.Group();
    const torsoMat = new THREE.MeshLambertMaterial({ color: torsoColor });

    const legMat = new THREE.MeshLambertMaterial({ color: 0x223a66 });
    const legL = new THREE.Mesh(legGeo, legMat); legL.position.set(-0.11, 0.31, 0);
    const legR = new THREE.Mesh(legGeo, legMat); legR.position.set( 0.11, 0.31, 0);

    const torso = new THREE.Mesh(torsoGeo, torsoMat); torso.position.y = 0.98;

    const armL = new THREE.Mesh(armGeo, torsoMat); armL.position.set(-0.33, 0.95, 0); armL.rotation.z = 0.16;
    const armR = new THREE.Mesh(armGeo, torsoMat); armR.position.set( 0.33, 0.95, 0); armR.rotation.z = -0.16;

    const handL = new THREE.Mesh(handGeo, yellowMat); handL.position.set(-0.38, 0.66, 0); handL.rotation.z = Math.PI / 2;
    const handR = new THREE.Mesh(handGeo, yellowMat); handR.position.set( 0.38, 0.66, 0); handR.rotation.z = Math.PI / 2;

    const head = new THREE.Mesh(headGeo, yellowMat); head.position.y = 1.50;
    const stud = new THREE.Mesh(studGeo, yellowMat); stud.position.y = 1.70;
    const face = new THREE.Mesh(faceGeo, new THREE.MeshBasicMaterial({ map: faceTex, transparent: true }));
    face.position.set(0, 1.50, 0.221);

    g.add(legL, legR, torso, armL, armR, handL, handR, head, stud, face);
    return { group: g, head: head, torso: torso };
  }

  /* =====================================================
     ENEMIES
     ===================================================== */
  function randomSpawn(minDistFromPlayer, rng) {
    rng = rng || Math.random;
    minDistFromPlayer = minDistFromPlayer || 0;
    for (let i = 0; i < 60; i++) {
      const x = (rng() - 0.5) * (GRID * CELL - 8);
      const z = (rng() - 0.5) * (GRID * CELL - 8);
      if (Math.hypot(x - camera.position.x, z - camera.position.z) < minDistFromPlayer) continue;
      const box = new THREE.Box3(
        new THREE.Vector3(x - 0.5, 0.2, z - 0.5),
        new THREE.Vector3(x + 0.5, 1.8, z + 0.5)
      );
      let bad = false;
      for (let j = 0; j < colliders.length; j++) {
        if (colliders[j].intersectsBox(box)) { bad = true; break; }
      }
      if (!bad) return { x: x, z: z };
    }
    return { x: 0, z: 0 };
  }

  function spawnEnemyAt(spawnPt) {
    const color = torsoColors[Math.floor(Math.random() * torsoColors.length)];
    const fig = makeLegoFigure(color);
    fig.group.position.set(spawnPt.x, 0, spawnPt.z);
    scene.add(fig.group);

    return {
      group: fig.group,
      head: fig.head,
      torso: fig.torso,
      hp: 100,
      alive: true,
      shootCd: 1.5 + Math.random() * 1.5,
      stepPhase: Math.random() * Math.PI * 2,
      // ---- hunting data ----
      huntX: 0,          // their current belief of player position
      huntZ: 0,
      noiseTimer: 0,
      stuckTimer: 0,
      lastX: spawnPt.x,
      lastZ: spawnPt.z,
      escapeTimer: 0,
      escapeDirX: 0,
      escapeDirZ: 0
    };
  }

  /* =====================================================
     GUN VIEWMODEL
     ===================================================== */
  function buildGun() {
    if (gunGroup && gunGroup.parent) gunGroup.parent.remove(gunGroup);
    gunGroup = new THREE.Group();
    const dark = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
    const grey = new THREE.MeshLambertMaterial({ color: 0x555555 });

    const body   = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.13, 0.36), dark);
    const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.07, 0.16), grey);
    barrel.position.set(0, 0.03, -0.25);
    const handle = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.22, 0.11), dark);
    handle.position.set(0, -0.16, 0.06); handle.rotation.x = -0.3;
    const sight  = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.05, 0.02), grey);
    sight.position.set(0, 0.10, -0.15);

    gunGroup.add(body, barrel, handle, sight);
    gunGroup.position.set(0.30, -0.28, -0.62);
    gunGroup.rotation.y = -0.05;
    camera.add(gunGroup);
  }

  /* =====================================================
     TRACERS
     ===================================================== */
  function addTracer(from, to, color) {
    const geo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(from.x, from.y, from.z),
      new THREE.Vector3(to.x, to.y, to.z)
    ]);
    const mat = new THREE.LineBasicMaterial({
      color: color || 0xfff5a0, transparent: true, opacity: 1
    });
    const line = new THREE.Line(geo, mat);
    scene.add(line);
    tracers.push({ line: line, life: 0 });
  }

  /* =====================================================
     HUD
     ===================================================== */
  const hudEl        = document.getElementById('hud');
  const hpEl         = document.getElementById('hp');
  const hpFillEl     = document.getElementById('hpfill');
  const killsEl      = document.getElementById('kills');
  const timerEl      = document.getElementById('timer');
  const levelLabelEl = document.getElementById('levelLabel');
  const hitMarkEl    = document.getElementById('hitmark');
  const damageEl     = document.getElementById('damage');
  const crosshairEl  = document.getElementById('crosshair');
  const readyOverlay = document.getElementById('readyOverlay');
  const readyMsgEl   = document.getElementById('readyMsg');
  const readySubEl   = document.getElementById('readySub');
  const menuEl       = document.getElementById('menu');
  const levelGridEl  = document.getElementById('levelGrid');
  const progressEl   = document.getElementById('progressText');
  const endScreenEl  = document.getElementById('endScreen');
  const endTitleEl   = document.getElementById('endTitle');
  const endSubEl     = document.getElementById('endSub');
  const endBtnsEl    = document.getElementById('endBtns');

  function fmtTime(sec) {
    const s = Math.max(0, Math.ceil(sec));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r;
  }

  function updateHUD() {
    hpEl.textContent = Math.max(0, Math.round(hp));
    hpFillEl.style.width = Math.max(0, hp) + '%';
    hpFillEl.style.background = hp > 60 ? '#d8e04a' : hp > 30 ? '#ffcc44' : '#ff5555';
    killsEl.textContent = kills;
    timerEl.textContent = fmtTime(timeLeft);
    levelLabelEl.textContent = 'LEVEL ' + currentLevel + ' — ' + LEVELS[currentLevel - 1].name;
    timerEl.classList.toggle('warning',  timeLeft <= 10 && timeLeft > 5);
    timerEl.classList.toggle('critical', timeLeft <= 5);
  }

  function flashHitmark() {
    hitMarkEl.style.opacity = '1';
    setTimeout(function () { hitMarkEl.style.opacity = '0'; }, 110);
  }
  function flashDamage() {
    damageEl.style.opacity = '1';
    setTimeout(function () { damageEl.style.opacity = '0'; }, 120);
  }

  /* =====================================================
     MENU
     ===================================================== */
  function renderMenu() {
    levelGridEl.innerHTML = '';
    for (let i = 0; i < LEVELS.length; i++) {
      const lv = LEVELS[i];
      const card = document.createElement('div');
      const locked = (i + 1) > progress;
      card.className = 'levelCard tier-' + lv.tier + (locked ? ' locked' : '');
      card.innerHTML =
        '<div class="num">' + (i + 1) + '</div>' +
        '<div class="meta">' + lv.time + 's · ' + lv.enemies + ' en</div>' +
        '<div class="diff">' + ['EASY','EASY','NORMAL','NORMAL','HARD','HARD','VERY HARD','VERY HARD','EXTREME','EXTREME'][i] + '</div>';
      if (!locked) {
        card.addEventListener('click', (function (n) { return function () { startLevel(n); }; })(i + 1));
      }
      levelGridEl.appendChild(card);
    }
    progressEl.textContent = 'Progress: ' + progress + ' / 10';
  }

  document.getElementById('resetBtn').addEventListener('click', function () {
    const b = this;
    if (b.dataset.armed === '1') {
      progress = 1;
      lsSet('br_progress', '1');
      b.dataset.armed = ''; b.textContent = 'Reset Progress';
      renderMenu();
    } else {
      b.dataset.armed = '1'; b.textContent = 'Click again to confirm';
      setTimeout(function(){ if (b.dataset.armed==='1'){ b.dataset.armed=''; b.textContent='Reset Progress'; } }, 3000);
    }
  });

  /* =====================================================
     SCENE SETUP
     ===================================================== */
  function buildScene(level) {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(YELLOW);
    scene.fog = new THREE.Fog(YELLOW, 1.5, 34);   // tighter fog for smaller arena

    camera.position.set(0, 1.7, 0);
    camera.rotation.set(0, 0, 0);
    camera.rotation.order = 'YXZ';
    scene.add(camera);

    scene.add(new THREE.AmbientLight(0xffee99, 0.85));
    scene.add(new THREE.HemisphereLight(0xffeeaa, 0x554422, 0.55));
    const sun = new THREE.DirectionalLight(0xfff0c0, 0.35);
    sun.position.set(10, 30, 10);
    scene.add(sun);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(GRID * CELL + 10, GRID * CELL + 10),
      new THREE.MeshLambertMaterial({ map: floorTex })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const ceil = new THREE.Mesh(
      new THREE.PlaneGeometry(GRID * CELL + 10, GRID * CELL + 10),
      ceilMat
    );
    ceil.rotation.x = Math.PI / 2;
    ceil.position.y = WALL_H;
    scene.add(ceil);

    colliders = [];
    tracers = [];
    enemies = [];

    buildLayout(level);
    buildGun();
  }

  /* =====================================================
     LEVEL FLOW
     ===================================================== */
  function startLevel(n) {
    currentLevel = n;
    cfg = enemyCfg(n);

    hp = 100;
    timeLeft = LEVELS[n - 1].time;
    kills = 0;
    lastDamage = -10;
    regenAcc = 0;

    yaw = 0; pitch = 0;
    vy = 0; onGround = true;

    buildScene(n);

    const rng = makeRNG(n * 99991);
    for (let i = 0; i < LEVELS[n - 1].enemies; i++) {
      enemies.push(spawnEnemyAt(randomSpawn(20, rng)));
    }

    menuEl.style.display = 'none';
    endScreenEl.classList.remove('on');
    hudEl.classList.add('on');
    crosshairEl.classList.add('on');
    canvas.classList.add('in-game');

    readyMsgEl.textContent = 'LEVEL ' + n + ' — ' + LEVELS[n - 1].name;
    readySubEl.innerHTML = 'Survive ' + LEVELS[n - 1].time + 's &nbsp;·&nbsp; Click to begin<br><span style="opacity:.7">WASD move · mouse look · click shoot</span>';
    readyOverlay.classList.add('on');

    updateHUD();
    gameState = 'ready';
  }

  function beginPlay() {
    if (gameState !== 'ready') return;
    readyOverlay.classList.remove('on');
    gameState = 'playing';
    try { const p = canvas.requestPointerLock(); if (p && p.catch) p.catch(function(){}); } catch (e) {}
  }

  function endLevel(win) {
    if (gameState === 'won' || gameState === 'lost') return;
    gameState = win ? 'won' : 'lost';
    if (document.pointerLockElement) document.exitPointerLock();

    if (win && currentLevel >= progress && currentLevel < 10) {
      progress = currentLevel + 1;
      lsSet('br_progress', String(progress));
    } else if (win && currentLevel === 10) {
      progress = 10;
      lsSet('br_progress', '10');
    }

    endTitleEl.textContent = win ? 'LEVEL CLEAR' : 'YOU DIED';
    endTitleEl.className = win ? 'win' : 'lose';
    endSubEl.textContent = win
      ? 'Survived ' + LEVELS[currentLevel - 1].time + 's — Kills: ' + kills
      : 'Killed ' + kills + ' entities before falling';

    endBtnsEl.innerHTML = '';

    if (win) {
      if (currentLevel < 10) {
        const next = document.createElement('button');
        next.className = 'btn primary';
        next.textContent = 'Next Level';
        next.addEventListener('click', function () { startLevel(currentLevel + 1); });
        endBtnsEl.appendChild(next);
      } else {
        const done = document.createElement('div');
        done.style.cssText = 'color:#a8e07a;font-size:14px;letter-spacing:3px;padding:14px';
        done.textContent = '🏆  YOU ESCAPED';
        endBtnsEl.appendChild(done);
      }
      const retry = document.createElement('button');
      retry.className = 'btn';
      retry.textContent = 'Replay';
      retry.addEventListener('click', function () { startLevel(currentLevel); });
      endBtnsEl.appendChild(retry);
    } else {
      const retry = document.createElement('button');
      retry.className = 'btn primary';
      retry.textContent = 'Retry';
      retry.addEventListener('click', function () { startLevel(currentLevel); });
      endBtnsEl.appendChild(retry);
    }

    const menuBtn = document.createElement('button');
    menuBtn.className = 'btn';
    menuBtn.textContent = 'Menu';
    menuBtn.addEventListener('click', backToMenu);
    endBtnsEl.appendChild(menuBtn);

    endScreenEl.classList.add('on');
    renderMenu();
  }

  function backToMenu() {
    gameState = 'menu';
    if (document.pointerLockElement) document.exitPointerLock();
    endScreenEl.classList.remove('on');
    hudEl.classList.remove('on');
    crosshairEl.classList.remove('on');
    readyOverlay.classList.remove('on');
    canvas.classList.remove('in-game');
    menuEl.style.display = 'flex';
    renderMenu();
  }

  /* =====================================================
     INPUT
     ===================================================== */
  canvas.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    if (gameState === 'ready') { beginPlay(); return; }
    if (gameState === 'playing' && isLocked) shoot();
  });

  document.addEventListener('pointerlockchange', function () {
    isLocked = document.pointerLockElement === canvas;
    if (isLocked) {
      startAudio();
      if (gameState === 'ready') {
        readyOverlay.classList.remove('on');
        gameState = 'playing';
      }
    } else if (gameState === 'playing') {
      readyMsgEl.textContent = 'PAUSED';
      readySubEl.innerHTML = 'Click to resume &nbsp;·&nbsp; <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &nbsp;·&nbsp; click shoot';
      readyOverlay.classList.add('on');
      gameState = 'ready';
    }
  });

  document.addEventListener('mousemove', function (e) {
    if (!isLocked) return;
    yaw   -= e.movementX * 0.0022;
    pitch -= e.movementY * 0.0022;
    const lim = Math.PI / 2 - 0.05;
    if (pitch >  lim) pitch =  lim;
    if (pitch < -lim) pitch = -lim;
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;
  });

  document.addEventListener('keydown', function (e) {
    keys[e.code] = true;
    if (e.code === 'Space') e.preventDefault();
  });
  document.addEventListener('keyup', function (e) {
    keys[e.code] = false;
  });

  /* =====================================================
     COLLISION
     ===================================================== */
  function tryMoveAxis(pos, axis, amount, radius, eyeH) {
    if (amount === 0) return;
    radius = radius || 0.42;
    eyeH = eyeH === undefined ? 1.7 : eyeH;
    const p = pos.clone();
    p[axis] += amount;
    const box = new THREE.Box3(
      new THREE.Vector3(p.x - radius, p.y - eyeH + 0.1, p.z - radius),
      new THREE.Vector3(p.x + radius, p.y + 0.1, p.z + radius)
    );
    for (let i = 0; i < colliders.length; i++) {
      if (colliders[i].intersectsBox(box)) return;
    }
    pos[axis] = p[axis];
  }

  function tryMoveAxisEnemy(pos, axis, amount) {
    if (amount === 0) return;
    const radius = 0.40;
    const p = pos.clone();
    p[axis] += amount;
    const box = new THREE.Box3(
      new THREE.Vector3(p.x - radius, 0.1, p.z - radius),
      new THREE.Vector3(p.x + radius, 1.9, p.z + radius)
    );
    for (let i = 0; i < colliders.length; i++) {
      if (colliders[i].intersectsBox(box)) return;
    }
    pos[axis] = p[axis];
  }

  function checkLOS(from, to) {
    const eye = new THREE.Vector3(from.x, 1.4, from.z);
    const tgt = new THREE.Vector3(to.x, 1.4, to.z);
    const dir = tgt.clone().sub(eye);
    const dist = dir.length();
    if (dist < 0.1) return true;
    dir.normalize();
    const ray = new THREE.Raycaster(eye, dir, 0.1, dist - 0.3);
    for (let i = 0; i < colliders.length; i++) {
      const hitPt = ray.ray.intersectBox(colliders[i], new THREE.Vector3());
      if (hitPt && hitPt.distanceTo(eye) < dist - 0.5) return false;
    }
    return true;
  }

  /* =====================================================
     PLAYER
     ===================================================== */
  let walking = false;
  let bobPhase = 0;
  let gunKick = 0;

  function movePlayer(dt) {
    const sinY = Math.sin(yaw), cosY = Math.cos(yaw);
    const fwdX = -sinY, fwdZ = -cosY;
    const rgtX =  cosY, rgtZ = -sinY;

    let mx = 0, mz = 0;
    if (keys['KeyW'] || keys['ArrowUp'])    { mx += fwdX; mz += fwdZ; }
    if (keys['KeyS'] || keys['ArrowDown'])  { mx -= fwdX; mz -= fwdZ; }
    if (keys['KeyD'] || keys['ArrowRight']) { mx += rgtX; mz += rgtZ; }
    if (keys['KeyA'] || keys['ArrowLeft'])  { mx -= rgtX; mz -= rgtZ; }

    const len = Math.hypot(mx, mz);
    walking = len > 0;
    if (len > 0) {
      const step = PLAYER_SPEED * dt / len;
      tryMoveAxis(camera.position, 'x', mx * step);
      tryMoveAxis(camera.position, 'z', mz * step);
    }

    if (keys['Space'] && onGround) { vy = 7.0; onGround = false; }
    vy -= 22 * dt;
    camera.position.y += vy * dt;
    if (camera.position.y <= 1.7) {
      camera.position.y = 1.7;
      vy = 0; onGround = true;
    }
  }

  /* =====================================================
     SHOOTING
     ===================================================== */
  const raycaster = new THREE.Raycaster();
  const ndcCenter = new THREE.Vector2(0, 0);
  const rayEnd = new THREE.Vector3();

  function shoot() {
    if (gameState !== 'playing') return;
    playShotSound();
    gunKick = 1;

    raycaster.setFromCamera(ndcCenter, camera);

    const targets = [];
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive) continue;
      targets.push(e.head);
      targets.push(e.torso);
    }

    const hits = raycaster.intersectObjects(targets, false);

    if (hits.length > 0) {
      const hit = hits[0];
      rayEnd.copy(hit.point);
      let enemy = null, isHead = false;
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (e.head === hit.object)  { enemy = e; isHead = true;  break; }
        if (e.torso === hit.object) { enemy = e; isHead = false; break; }
      }
      if (enemy) {
        enemy.hp -= isHead ? 100 : 34;
        flashHitmark();
        if (enemy.hp <= 0) {
          enemy.alive = false;
          enemy.group.visible = false;
          kills++;
          updateHUD();
        }
      }
    } else {
      raycaster.ray.at(120, rayEnd);
    }

    addTracer(camera.position, rayEnd, 0xfff5a0);
  }

  /* =====================================================
     ENEMY AI  — they ALWAYS hunt the player
     ===================================================== */
  function updateEnemies(dt) {
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive) continue;

      const pos = e.group.position;
      const dxP = camera.position.x - pos.x;
      const dzP = camera.position.z - pos.z;
      const distToPlayer = Math.hypot(dxP, dzP);

      // --- line of sight (real) ---
      let hasLOS = false;
      if (distToPlayer < cfg.range * 1.3) {
        hasLOS = checkLOS(pos, camera.position);
      }

      // --- update the enemy's belief of where the player is ---
      //  If they can see you → exact. If not → noisy estimate (they "sense" you).
      e.noiseTimer -= dt;
      if (e.noiseTimer <= 0) {
        e.noiseTimer = 0.7 + Math.random() * 0.8;
        if (hasLOS) {
          e.huntX = camera.position.x;
          e.huntZ = camera.position.z;
        } else {
          const n = cfg.noiseAmount;
          e.huntX = camera.position.x + (Math.random() - 0.5) * n * 2;
          e.huntZ = camera.position.z + (Math.random() - 0.5) * n * 2;
        }
      } else if (hasLOS) {
        // constant refresh when visible
        e.huntX = camera.position.x;
        e.huntZ = camera.position.z;
      }

      // --- target direction ---
      let tdx = e.huntX - pos.x;
      let tdz = e.huntZ - pos.z;
      let td = Math.hypot(tdx, tdz);

      // --- stuck detection & escape ---
      const moved = Math.hypot(pos.x - e.lastX, pos.z - e.lastZ);
      if (moved < 0.015 && td > 1.0) {
        e.stuckTimer += dt;
      } else {
        e.stuckTimer = 0;
      }
      e.lastX = pos.x;
      e.lastZ = pos.z;

      if (e.stuckTimer > 0.5 && e.escapeTimer <= 0) {
        // pick a perpendicular direction to slide along the wall
        const nx = td > 0.01 ? tdx / td : 0;
        const nz = td > 0.01 ? tdz / td : 0;
        const sign = Math.random() < 0.5 ? -1 : 1;
        e.escapeDirX = -nz * sign;
        e.escapeDirZ =  nx * sign;
        e.escapeTimer = 0.6 + Math.random() * 0.5;
        e.stuckTimer = 0;
      }

      // --- movement ---
      let stepX = 0, stepZ = 0;
      const stopDist = hasLOS ? 4.5 : 0.5;

      if (e.escapeTimer > 0) {
        e.escapeTimer -= dt;
        stepX = e.escapeDirX;
        stepZ = e.escapeDirZ;
      } else if (td > stopDist && td > 0.01) {
        stepX = tdx / td;
        stepZ = tdz / td;
      }

      const stepLen = Math.hypot(stepX, stepZ);
      if (stepLen > 0.01) {
        const step = cfg.speed * dt;
        tryMoveAxisEnemy(pos, 'x', stepX / stepLen * step);
        tryMoveAxisEnemy(pos, 'z', stepZ / stepLen * step);
      }

      // walk bob
      e.stepPhase += dt * 8;
      pos.y = Math.abs(Math.sin(e.stepPhase) * 0.04);

      // face the player (their belief — good enough visually)
      e.group.rotation.y = Math.atan2(dxP, dzP);

      // --- shoot (only when actually visible) ---
      e.shootCd -= dt;
      if (hasLOS && e.shootCd <= 0 && distToPlayer < cfg.range && gameState === 'playing') {
        e.shootCd = cfg.fireCooldown * (0.85 + Math.random() * 0.3);

        const willHit = Math.random() < cfg.hitChance;
        const spread = willHit ? 0.35 : 3.5;
        const targetPt = new THREE.Vector3(
          camera.position.x + (Math.random() - 0.5) * spread,
          camera.position.y - 0.15 + (Math.random() - 0.5) * spread,
          camera.position.z + (Math.random() - 0.5) * spread
        );
        addTracer({ x: pos.x, y: 1.4, z: pos.z }, targetPt, 0xffaa55);
        playEnemyShot();
        if (willHit) damagePlayer(3 + Math.random() * 3);
      }
    }
  }

  /* =====================================================
     DAMAGE / REGEN
     ===================================================== */
  function damagePlayer(amount) {
    if (gameState !== 'playing') return;
    hp -= amount;
    lastDamage = performance.now() / 1000;
    flashDamage();
    updateHUD();
    if (hp <= 0) {
      hp = 0;
      updateHUD();
      endLevel(false);
    }
  }

  function updateRegen(dt) {
    if (gameState !== 'playing') return;
    const now = performance.now() / 1000;
    if (now - lastDamage > 4 && hp < 100) {
      regenAcc += dt;
      if (regenAcc > 0.12) {
        hp = Math.min(100, hp + 1);
        updateHUD();
        regenAcc = 0;
      }
    }
  }

  /* =====================================================
     AUDIO
     ===================================================== */
  let audioCtx = null;
  function startAudio() {
    if (audioCtx) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return;
    }
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc1 = audioCtx.createOscillator();
      osc1.type = 'sine'; osc1.frequency.value = 60;
      const g1 = audioCtx.createGain();
      g1.gain.value = 0.0;
      osc1.connect(g1).connect(audioCtx.destination);
      osc1.start();
      g1.gain.linearRampToValueAtTime(0.022, audioCtx.currentTime + 1.2);

      const osc2 = audioCtx.createOscillator();
      osc2.type = 'sawtooth'; osc2.frequency.value = 118;
      const filt = audioCtx.createBiquadFilter();
      filt.type = 'lowpass'; filt.frequency.value = 380;
      const g2 = audioCtx.createGain();
      g2.gain.value = 0.0;
      osc2.connect(filt).connect(g2).connect(audioCtx.destination);
      osc2.start();
      g2.gain.linearRampToValueAtTime(0.009, audioCtx.currentTime + 1.2);
    } catch (err) { /* ignore */ }
  }

  function playShotSound() {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    osc.type = 'square';
    osc.frequency.setValueAtTime(220, t0);
    osc.frequency.exponentialRampToValueAtTime(60, t0 + 0.09);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.12, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.14);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + 0.15);
  }

  function playEnemyShot() {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(340, t0);
    osc.frequency.exponentialRampToValueAtTime(90, t0 + 0.08);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.04, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.12);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + 0.13);
  }

  /* =====================================================
     MAIN LOOP
     ===================================================== */
  let lastT = performance.now();
  function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();
    const dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;

    if (gameState === 'playing') {
      movePlayer(dt);
      updateEnemies(dt);
      updateRegen(dt);

      timeLeft -= dt;
      if (timeLeft <= 0) {
        timeLeft = 0;
        updateHUD();
        endLevel(true);
      } else {
        updateHUD();
      }
    }

    if (gunGroup) {
      if (walking && gameState === 'playing') bobPhase += dt * 9;
      const bobX = Math.sin(bobPhase) * 0.012;
      const bobY = Math.abs(Math.cos(bobPhase)) * 0.012;
      gunKick = Math.max(0, gunKick - dt * 8);
      gunGroup.position.set(0.30 + bobX, -0.28 + bobY + gunKick * 0.02, -0.62 + gunKick * 0.05);
      gunGroup.rotation.x = gunKick * 0.15;
    }

    for (let i = tracers.length - 1; i >= 0; i--) {
      const tr = tracers[i];
      tr.life += dt;
      tr.line.material.opacity = Math.max(0, 1 - tr.life * 5);
      if (tr.life > 0.22) {
        scene.remove(tr.line);
        tr.line.geometry.dispose();
        tr.line.material.dispose();
        tracers.splice(i, 1);
      }
    }

    if (scene) renderer.render(scene, camera);
  }
  animate();

  addEventListener('resize', function () {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  buildScene(1);
  renderMenu();
})();
</script>
</body>
</html>
