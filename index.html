<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Backrooms Survival</title>
<link rel="stylesheet" href="css/hud.css" />
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/"
  }
}
</script>
</head>
<body>

<canvas id="c"></canvas>

<div id="vignette"></div>
<div id="damage"></div>
<div id="flash"></div>
<div id="crosshair"><i></i><i></i><i></i><i></i></div>
<div id="hitmark">✕</div>
<div id="scope"><div class="ring"></div><div class="h"></div><div class="v"></div><div class="mil"></div></div>
<div id="popups"></div>
<div id="killfeed"></div>

<div id="hud">
  <div class="hp-wrap">
    <div class="hp-label">HP <span id="hp">100</span></div>
    <div id="hpbar"><div id="hpfill"></div></div>
  </div>
  <div class="stat">KILLS <span id="kills">0</span></div>
</div>

<div id="ammo">
  <div id="weaponName">M416</div>
  <div class="ammo-row"><span id="ammoMag">30</span><span class="sep">/</span><span id="ammoRes">90</span></div>
  <div id="reloadHint">PRESS <kbd>R</kbd> TO RELOAD</div>
  <div id="slots">
    <div class="slot" data-slot="1"><span class="k">1</span><span id="slot1">M416</span></div>
    <div class="slot" data-slot="2"><span class="k">2</span><span id="slot2">Kar98k</span></div>
    <div class="slot" data-slot="g"><span class="k">G</span><span id="slotG">✸ ×2</span></div>
  </div>
</div>

<div id="topbar">
  <div id="timer">00:00</div>
  <div id="levelLabel">LEVEL 1</div>
</div>

<div id="fps"></div>

<div id="readyOverlay">
  <div id="readyMsg">Level 1</div>
  <div id="readySub">Click to begin · <kbd>WASD</kbd> move · <kbd>RMB</kbd> aim · <kbd>1</kbd><kbd>2</kbd> weapons · <kbd>G</kbd> grenade</div>
</div>

<div id="menu">
  <div class="menu-inner">
    <h1>THE BACKROOMS</h1>
    <div class="subtitle">They always find you.</div>
    <div id="levelGrid"></div>
    <div class="settings">
      <span class="settings-label">GRAPHICS</span>
      <div class="seg" id="gfxSeg">
        <button data-gfx="low">Low</button>
        <button data-gfx="medium">Medium</button>
        <button data-gfx="high">High</button>
      </div>
    </div>
    <div class="foot">
      <div id="progressText">Progress: 1 / 10</div>
      <button id="resetBtn">Reset Progress</button>
    </div>
  </div>
  <div id="loading">Loading…</div>
</div>

<div id="endScreen">
  <h1 id="endTitle">LEVEL CLEAR</h1>
  <div id="endSub"></div>
  <div class="btnRow" id="endBtns"></div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
